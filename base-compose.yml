version: "3.9"

services:
  registry:
    image: registry:2
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  base-php:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: localhost:5000/base-php:latest
    depends_on:
      - registry
    # on pousse automatiquement l’image dans le registry local après build
    command: >
      sh -c "
        echo 'Pushing base-php to local registry...' &&
        docker push localhost:5000/base-php:latest
      "

volumes:
  registry-data:
